[project]
name = "judgetap"
version = "0.3.0"
description = "Fast typed decisions (choice, score, yes/no) across Jev-style engines, plus a guard for coding agents. Early development."
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Omer Bar-Ness", email = "omer@zsquared.io" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
judgetap = "judgetap.cli:main"
snapjudge = "judgetap.cli:main"  # deprecated alias, removed after one release

[project.optional-dependencies]
llm = ["litellm>=1.40"]
laya = ["laya"]
gliner = ["gliner2"]
keychain = ["keyring>=24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[project.urls]
Homepage = "https://github.com/mergesafe-ai/judgetap"

[tool.hatch.build]
artifacts = ["src/judgetap/dashboard/page.html"]
