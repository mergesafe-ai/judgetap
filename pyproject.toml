[project]
name = "snapjudge"
version = "0.0.1"
description = "Fast typed decisions (choice, score, yes/no) across Jev-style engines, plus a guard for coding agents. Early development."
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Omer Bar-Ness", email = "omer@zsquared.io" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
snapjudge = "snapjudge.cli:main"

[project.optional-dependencies]
llm = ["litellm>=1.40"]
laya = ["laya"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[project.urls]
Homepage = "https://github.com/mergesafe-ai/snapjudge"

[tool.hatch.build]
artifacts = ["src/snapjudge/dashboard/page.html"]
