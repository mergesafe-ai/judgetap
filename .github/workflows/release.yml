# Two channels to PyPI, one trusted publisher (this file, environment `pypi`):
#   - every push to main  -> a dev pre-release (X.Y.Z.devN). pip ignores
#     pre-releases by default, so `pip install judgetap` never gets one;
#     `pip install --pre judgetap` does.
#   - a GitHub Release     -> the stable version ("latest"). Releases come from
#     merging release-please's release PR, or from publishing one by hand.
name: release
on:
  push:
    branches: [main]
  release:
    types: [published]
  # Publish an existing tag by hand (e.g. a release whose publish job failed).
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, e.g. v0.1.0"
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      pr_branch: ${{ steps.rp.outputs.pr && fromJSON(steps.rp.outputs.pr).headBranchName || '' }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please bumps pyproject.toml but can't edit uv.lock's package
  # table, so relock the release PR's branch whenever release-please updates it.
  relock:
    needs: release-please
    if: github.event_name == 'push' && needs.release-please.outputs.pr_branch != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.pr_branch }}
      - uses: astral-sh/setup-uv@v6
      - run: uv lock
      - name: Commit the refreshed lockfile
        env:
          BRANCH: ${{ needs.release-please.outputs.pr_branch }}
        run: |
          git diff --quiet uv.lock && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh uv.lock for the release" uv.lock
          git push origin "HEAD:refs/heads/$BRANCH"

  # Stable: the release-please release (created with GITHUB_TOKEN, which
  # doesn't trigger `release` events, so no double publish) or a release
  # published by hand in the GitHub UI.
  publish:
    needs: release-please
    if: >-
      always() &&
      ((github.event_name == 'push' && needs.release-please.outputs.released == 'true') ||
       (github.event_name == 'release' && !github.event.release.prerelease) ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI Trusted Publishing
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Always a tag, never a branch that happens to share the name.
          ref: refs/tags/${{ needs.release-please.outputs.tag || github.event.release.tag_name || inputs.tag }}
      - uses: astral-sh/setup-uv@v6
      - name: A manual publish needs a GitHub Release for the tag
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
      - name: Check the tag matches the package version
        # The tag arrives through the environment, never interpolated into the
        # script: a release tag is user-controlled text.
        env:
          TAG: ${{ needs.release-please.outputs.tag || github.event.release.tag_name || inputs.tag }}
        run: |
          version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          # Tags are vX.Y.Z; older ones carry the component: judgetap-vX.Y.Z.
          tag_version="${TAG#judgetap-}"
          tag_version="${tag_version#v}"
          test "$tag_version" = "$version" || { echo "tag does not match version $version"; exit 1; }
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1

  # Dev: every push to main that isn't itself a release.
  publish-dev:
    needs: release-please
    if: github.event_name == 'push' && needs.release-please.outputs.released != 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Set a dev version for the next patch
        # 0.1.0 on main -> 0.1.1.dev<run number>: sorts after the last release
        # and before the next one, and is unique per run.
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          uv run --no-project python - <<'EOF'
          import json, os, re, pathlib
          # run_number * 100 + attempt: a rerun (same run number) still gets a
          # new, higher version; up to 99 attempts per run.
          run = int(os.environ["RUN_NUMBER"]) * 100 + int(os.environ["RUN_ATTEMPT"])
          current = json.load(open(".release-please-manifest.json"))["."]
          major, minor, patch = (int(x) for x in current.split("."))
          dev = f"{major}.{minor}.{patch + 1}.dev{run}"
          p = pathlib.Path("pyproject.toml")
          p.write_text(re.sub(r'^version = ".*?"', f'version = "{dev}"', p.read_text(), count=1, flags=re.M))
          i = pathlib.Path("src/judgetap/__init__.py")
          i.write_text(re.sub(r'__version__ = ".*?"', f'__version__ = "{dev}"', i.read_text(), count=1))
          print("dev version", dev)
          EOF
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
